<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Base Plate -->
  <rect width="64" height="64" rx="16" fill="#04060a" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1" />
  
  <!-- L Monogram -->
  <path d="M16 18 V46 H30" fill="none" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- & / Connector Node -->
  <circle cx="34" cy="32" r="3.5" fill="#93c5fd" />
  <line x1="30" y1="46" x2="38" y2="46" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  
  <!-- K Monogram -->
  <path d="M40 18 V46 M48 20 L40 33 L49 46" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
